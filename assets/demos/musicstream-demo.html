<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MusicStream — Demo</title>
<style>
:root{
  --color-bg:#0f172a;--color-surface:#1e293b;--color-surface-2:#172033;--color-accent:#3b82f6;
  --color-text:#f1f5f9;--color-muted:#94a3b8;--border:#273449;
  --radius-sm:8px;--radius-md:12px;--radius-lg:20px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Segoe UI",sans-serif;background:var(--color-bg);color:var(--color-text);line-height:1.5;padding-bottom:84px}
header{position:sticky;top:0;z-index:40;background:rgba(15,23,42,.96);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.header-inner{max-width:1080px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand b{color:var(--color-accent)}
.genres{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--border);color:var(--color-muted);font-size:12.5px;cursor:pointer;background:var(--color-surface)}
.chip.active{border-color:var(--color-accent);color:var(--color-accent)}
.btn-premium{background:var(--color-accent);color:#fff;border:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:26px 22px}
.demo-note{margin-bottom:18px;padding:10px 13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--color-surface-2);color:var(--color-muted);font-size:12.5px}
.section-title{font-size:18px;font-weight:700;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{width:100%;text-align:left;color:inherit;font:inherit;background:var(--color-surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.vinyl{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;position:relative}
.vinyl svg{width:72%;height:72%}
.card-body{padding:11px 13px}
.card-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-artist{font-size:12px;color:var(--color-muted);margin-top:2px}
.card-genre{font-size:10.5px;color:var(--color-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
button{cursor:pointer;font-family:inherit}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.overlay.open{display:flex}
.modal{background:var(--color-surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:24px}
.modal-close{float:right;background:transparent;border:1px solid var(--border);color:var(--color-muted);padding:6px 10px;border-radius:8px;font-size:13px}
.album-hero{display:flex;gap:18px;align-items:center;margin-top:8px;margin-bottom:20px}
.album-hero .vinyl{width:120px;height:120px;flex-shrink:0;border-radius:var(--radius-md)}
.album-hero h2{font-size:21px;margin-bottom:4px}
.album-hero .meta{color:var(--color-muted);font-size:13px}
.track{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px}
.track:hover{background:var(--color-surface-2)}
.track-num{color:var(--color-muted);font-size:12px;width:18px}
.track-play{width:30px;height:30px;border-radius:50%;background:var(--color-accent);border:none;color:#fff;font-size:12px;flex-shrink:0}
.track-name{flex:1;font-size:13.5px}
.track-dur{color:var(--color-muted);font-size:12px}
/* player */
.player-bar{position:fixed;left:0;right:0;bottom:0;background:var(--color-surface);border-top:1px solid var(--border);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:16px;z-index:60}
.player-bar.open{display:flex}
.player-bar .vinyl{width:44px;height:44px;flex-shrink:0;border-radius:8px;animation:spin 6s linear infinite}
.player-bar.paused .vinyl{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.player-info{min-width:130px}
.player-info .t{font-size:13px;font-weight:600}
.player-info .a{font-size:11.5px;color:var(--color-muted)}
.player-controls{display:flex;align-items:center;gap:10px}
.player-controls button{background:transparent;border:none;color:var(--color-text);font-size:17px}
.play-toggle{width:34px;height:34px;border-radius:50%;background:var(--color-accent);color:#fff !important;display:flex;align-items:center;justify-content:center}
.progress-wrap{flex:1;display:flex;align-items:center;gap:8px;min-width:120px}
.progress{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--color-accent);width:30%}
.time{font-size:10.5px;color:var(--color-muted);min-width:30px}
.preview-note{font-size:10px;color:var(--color-muted)}
/* checkout */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.plan{width:100%;border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;cursor:pointer;text-align:left;background:transparent;color:var(--color-text);font:inherit}
.plan.selected{border-color:var(--color-accent);background:var(--color-surface-2)}
.plan .price{font-size:20px;font-weight:700;color:var(--color-accent);margin:4px 0}
.plan .price span{font-size:12px;color:var(--color-muted);font-weight:400}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--color-muted);margin-bottom:5px}
.field input{width:100%;background:var(--color-surface-2);border:1px solid var(--border);color:var(--color-text);padding:9px 11px;border-radius:8px;font-size:13.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-pay{width:100%;background:var(--color-accent);color:#fff;border:none;padding:12px;border-radius:999px;font-weight:600;font-size:14px;margin-top:6px}
.success-box{text-align:center;padding:20px 0}
.success-icon{font-size:40px;margin-bottom:10px}
@media(max-width:560px){.album-hero{flex-direction:column;align-items:flex-start}.plans{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">▶ Music<b>Stream</b></div>
    <div class="genres" id="genres" aria-label="Filtrar por género"></div>
    <button class="btn-premium" onclick="openCheckout()">Hazte Premium</button>
  </div>
</header>

<main class="wrap">
  <p class="demo-note"><strong>Demo frontend:</strong> la reproducción es visual; no hay audio real ni se procesan pagos. No ingreses información de tarjeta.</p>
  <h2 class="section-title">Álbumes destacados</h2>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="albumOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="albumTitle">
    <button class="modal-close" onclick="closeOverlay('albumOverlay')">Cerrar ✕</button>
    <div id="albumBody"></div>
  </div>
</div>

<div class="overlay" id="checkoutOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle" style="max-width:460px">
    <button class="modal-close" onclick="closeOverlay('checkoutOverlay')">Cerrar ✕</button>
    <div id="checkoutBody"></div>
  </div>
</div>

<div class="player-bar" id="playerBar">
  <div class="vinyl" id="playerVinyl"></div>
  <div class="player-info"><div class="t" id="playerTrack">—</div><div class="a" id="playerArtist">—</div><div class="preview-note">Vista previa visual · sin audio</div></div>
  <div class="progress-wrap"><span class="time" id="playerTime">0:00</span><div class="progress" role="progressbar" aria-label="Progreso simulado" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill" style="width:0%"></div></div><span class="time" id="playerDur">0:00</span></div>
  <div class="player-controls">
    <button class="play-toggle" id="playToggle" type="button" aria-label="Pausar vista previa simulada" aria-pressed="true" onclick="togglePlay()">❚❚</button>
  </div>
</div>

<script>
function vinylColor(hex){
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#0b1220" stroke="${hex}" stroke-width="1.5"/><circle cx="50" cy="50" r="38" fill="none" stroke="#1b2740" stroke-width="1"/><circle cx="50" cy="50" r="30" fill="none" stroke="#1b2740" stroke-width="1"/><circle cx="50" cy="50" r="22" fill="none" stroke="#1b2740" stroke-width="1"/><circle cx="50" cy="50" r="13" fill="${hex}"/><circle cx="50" cy="50" r="3" fill="#0b1220"/></svg>`
}
const albums=[
 {t:"Luz de Neón",a:"Mirage Nocturno",g:"Synth-pop",c:"#3b82f6",tracks:[["Avenida 8",186],["Reflejos",204],["Noche Eléctrica",175],["Distancia Corta",221],["Luz de Neón",198]]},
 {t:"Raíces",a:"Alma Terrena",g:"Indie Folk",c:"#d97706",tracks:[["Camino de Tierra",233],["Vieja Guitarra",190],["Raíces",260],["Lluvia de Marzo",205]]},
 {t:"Voltaje",a:"Circuito Rojo",g:"Electrónica",c:"#ef4444",tracks:[["Encendido",168],["Pulso",192],["Voltaje",210],["Frecuencia",177],["Sobrecarga",201]]},
 {t:"Horizonte Azul",a:"Costa Serena",g:"Jazz / Chill",c:"#06b6d4",tracks:[["Marea Baja",240],["Horizonte Azul",255],["Café de Domingo",212],["Brisa",198]]},
 {t:"Calle 8",a:"Barrio Alto",g:"Hip-Hop",c:"#a855f7",tracks:[["Calle 8",182],["Subida",165],["Concreto",194],["Sin Freno",176],["Calle 8 (Outro)",120]]},
 {t:"Eco",a:"Nadia Vale",g:"Pop",c:"#22c55e",tracks:[["Eco",199],["Vuelve",211],["Papel y Tinta",187],["Mil Formas",220]]},
]
const genres=["Todos",...new Set(albums.map(a=>a.g))]
let activeGenre="Todos"
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function renderGenres(){
  document.getElementById("genres").innerHTML=genres.map(g=>`<button type="button" class="chip ${g===activeGenre?"active":""}" aria-pressed="${g===activeGenre}" data-g="${g}">${g}</button>`).join("")
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{activeGenre=c.dataset.g;renderGenres();renderGrid()})
}
function renderGrid(){
  const list=albums.filter(a=>activeGenre==="Todos"||a.g===activeGenre)
  document.getElementById("grid").innerHTML=list.map(a=>`
    <div class="card" role="button" tabindex="0" aria-haspopup="dialog" onclick="openAlbum('${a.t.replace(/'/g,"\\'")}')">
      <div class="vinyl" style="background:linear-gradient(160deg,${a.c}22,var(--color-surface))">${vinylColor(a.c)}</div>
      <div class="card-body">
        <div class="card-title">${a.t}</div>
        <div class="card-artist">${a.a}</div>
        <div class="card-genre">${a.g}</div>
      </div>
    </div>`).join("")
  document.querySelectorAll(".card").forEach(card=>card.addEventListener("keydown",event=>{
    if(event.key==="Enter"||event.key===" "){event.preventDefault();card.click()}
  }))
}
function openAlbum(title){
  const al=albums.find(x=>x.t===title)
  document.getElementById("albumBody").innerHTML=`
    <div class="album-hero">
      <div class="vinyl" style="background:linear-gradient(160deg,${al.c}22,var(--color-surface))">${vinylColor(al.c)}</div>
      <div><h2 id="albumTitle">${al.t}</h2><div class="meta">${al.a} · ${al.g} · ${al.tracks.length} canciones</div></div>
    </div>
    ${al.tracks.map((tr,i)=>`
      <div class="track">
        <span class="track-num">${i+1}</span>
        <button class="track-play" aria-label="Iniciar vista previa de ${tr[0]}" onclick="playTrack('${al.t.replace(/'/g,"\\'")}','${tr[0].replace(/'/g,"\\'")}','${al.a.replace(/'/g,"\\'")}','${al.c}',${tr[1]})">▶</button>
        <span class="track-name">${tr[0]}</span>
        <span class="track-dur">${fmt(tr[1])}</span>
      </div>`).join("")}
  `
  document.getElementById("albumOverlay").classList.add("open")
}
function closeOverlay(id){document.getElementById(id).classList.remove("open")}
let playing=false
let currentDuration=0
let currentElapsed=0
let playerTimer
function updatePlayerProgress(){
  const percentage=currentDuration?Math.round(currentElapsed/currentDuration*100):0
  document.getElementById("playerTime").textContent=fmt(currentElapsed)
  document.getElementById("progressFill").style.width=`${percentage}%`
  document.querySelector(".progress").setAttribute("aria-valuenow",percentage)
}
function playTrack(album,track,artist,color,dur){
  clearInterval(playerTimer)
  currentDuration=dur;currentElapsed=0
  document.getElementById("playerTrack").textContent=track
  document.getElementById("playerArtist").textContent=artist
  document.getElementById("playerDur").textContent=fmt(dur)
  document.getElementById("playerVinyl").innerHTML=vinylColor(color)
  document.getElementById("playerVinyl").style.background=`linear-gradient(160deg,${color}33,var(--color-surface))`
  document.getElementById("playerVinyl").style.borderRadius="50%"
  document.getElementById("playerBar").classList.add("open")
  document.getElementById("playerBar").classList.remove("paused")
  document.getElementById("playToggle").textContent="❚❚"
  document.getElementById("playToggle").setAttribute("aria-label","Pausar vista previa simulada")
  document.getElementById("playToggle").setAttribute("aria-pressed","true")
  playing=true
  updatePlayerProgress()
  playerTimer=setInterval(()=>{
    if(!playing)return
    currentElapsed=Math.min(currentElapsed+1,currentDuration)
    updatePlayerProgress()
    if(currentElapsed>=currentDuration){
      playing=false;document.getElementById("playerBar").classList.add("paused")
      document.getElementById("playToggle").textContent="▶"
      document.getElementById("playToggle").setAttribute("aria-label","Reanudar vista previa simulada")
      document.getElementById("playToggle").setAttribute("aria-pressed","false")
      clearInterval(playerTimer)
    }
  },1000)
}
function togglePlay(){
  playing=!playing
  document.getElementById("playerBar").classList.toggle("paused",!playing)
  document.getElementById("playToggle").textContent=playing?"❚❚":"▶"
  document.getElementById("playToggle").setAttribute("aria-label",playing?"Pausar vista previa simulada":"Reanudar vista previa simulada")
  document.getElementById("playToggle").setAttribute("aria-pressed",String(playing))
}
let selectedPlan="monthly"
function openCheckout(){
  document.getElementById("checkoutBody").innerHTML=`
    <h2 id="checkoutTitle" style="font-size:19px;margin-bottom:6px">Planes de muestra</h2>
    <p style="color:var(--color-muted);font-size:13px;margin-bottom:4px">Selecciona un plan para ver el estado de la interfaz. No se realizará ningún cobro.</p>
    <div class="plans">
      <button type="button" class="plan selected" id="planMonthly" aria-pressed="true" onclick="selectPlan('monthly')"><div>Mensual</div><div class="price">$9.900<span>/mes</span></div></button>
      <button type="button" class="plan" id="planAnnual" aria-pressed="false" onclick="selectPlan('annual')"><div>Anual</div><div class="price">$89.900<span>/año</span></div></button>
    </div>
    <button class="btn-pay" onclick="confirmPlan()">Probar selección</button>
  `
  document.getElementById("checkoutOverlay").classList.add("open")
}
function selectPlan(p){
  selectedPlan=p
  document.getElementById("planMonthly").classList.toggle("selected",p==="monthly")
  document.getElementById("planAnnual").classList.toggle("selected",p==="annual")
  document.getElementById("planMonthly").setAttribute("aria-pressed",String(p==="monthly"))
  document.getElementById("planAnnual").setAttribute("aria-pressed",String(p==="annual"))
}
function confirmPlan(){
  const planName=selectedPlan==="monthly"?"mensual":"anual"
  document.getElementById("checkoutBody").innerHTML=`
    <div class="success-box">
      <h2 id="checkoutTitle" style="margin-bottom:6px">Selección simulada</h2>
      <p style="color:var(--color-muted);font-size:13.5px">Plan ${planName}. No se ingresaron datos ni se procesó ningún pago.</p>
    </div>
  `
}
document.querySelectorAll(".overlay").forEach(overlay=>overlay.addEventListener("click",event=>{
  if(event.target===overlay)overlay.classList.remove("open")
}))
document.addEventListener("keydown",event=>{
  if(event.key==="Escape")document.querySelectorAll(".overlay.open").forEach(overlay=>overlay.classList.remove("open"))
})
renderGenres();renderGrid()
</script>
</body>
</html>
